name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: 🚀 Deploy to Hostinger (public_html/asim/)
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync Files to Hostinger (public_html/asim/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || 21 }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL || 'ftp' }}
          server-dir: 'public_html/asim/'
          local-dir: './hostinger_package/'
          dangerous-clean-slate: false # Never delete existing database or files on server!
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/db/vault_data.sqlite
            **/db/vault_data.sqlite-journal
            **/db/*.sqlite*
            **/README.md

